title: "Asistente de código local"
description: "Guías prácticas para montar y entender un asistente de código que corre en tu propia máquina, con modelos locales."
# Hoja de ruta orientativa. La posición en la lista es el número de parte.
image: "/images/series/asistente-codigo-local.webp"
parts:
  - title: "Ollama: primeros pasos hacia un asistente de código local"
    summary: "Instalar Ollama, arrancar un modelo de código y hablarle desde la terminal y desde su API local."
  - title: "Un harness propio desde cero: el bucle y cómo falla"
    summary: "Un harness de solo lectura para entender qué ofrece a los agentes y cómo falla su bucle."
  - title: "Contexto"
    summary: "Qué pasa cuando la conversación llena la ventana: historial, recorte, limpieza, compaction e instrucciones del proyecto."
  - title: "Escritura y permisos"
    summary: "Las herramientas de escritura y búsqueda (Write, Edit, Grep) y el sistema de permisos que las controla."
  - title: "Ejecución y seguridad"
    summary: "Ejecutar comandos (Bash), procesos en segundo plano y aislar la ejecución con un sandbox en Linux y macOS."
  - title: "Extensibilidad"
    summary: "Skills, hooks y servidores MCP, incluida la autenticación OAuth de los servidores remotos."
  - title: "Delegación"
    summary: "Subagentes: delegar parte del trabajo en otros agentes."
  - title: "Sesiones y evaluación"
    summary: "Transcripciones, retomar sesiones, replay, registro de lo que hace el agente y evals."
  - title: "Interfaz e integración"
    summary: "Una TUI y un modo sin interfaz para usar el harness desde scripts y CI."
