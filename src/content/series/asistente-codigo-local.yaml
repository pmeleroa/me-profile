title: "Asistente de código local"
description: "Guías prácticas para montar y entender un asistente de código que corre en tu propia máquina, con modelos locales."
# Hoja de ruta orientativa. La posición en la lista es el número de parte.
image: "/images/series/asistente-codigo-local.webp"
parts:
  - title: "Ollama: primeros pasos hacia un asistente de código local"
    summary: "Instalar Ollama, arrancar un modelo de código y hablarle desde la terminal y desde su API local."
  - title: "Un harness propio desde cero: el bucle y cómo falla"
    summary: "Un harness de solo lectura para entender qué ofrece a los agentes y cómo falla su bucle."
  - title: "Compactar es lo fácil: lo difícil es saber que te quedaste sin sitio"
    summary: "Qué pasa cuando la conversación no cabe y el servidor responde 200 sin tu tarea: detectar el recorte, recortar, limpiar y compactar, e instrucciones del proyecto."
  - title: "Los permisos deciden dónde, no qué: dejar que el agente escriba"
    summary: "Las herramientas de escritura y búsqueda (Write, Edit, Grep) y un sistema de permisos que limita dónde escribe el agente, con deny, perímetro de workspace y read-before-edit, y por qué lo que escribe se revisa con git diff."
  - title: "El sandbox es la defensa real: aislar lo que ejecuta el agente"
    summary: "Bash, reglas de comando con tree-sitter y un sandbox del sistema operativo con bubblewrap: las reglas deciden cuándo preguntar, el sandbox qué puede pasar aunque se equivoquen, y lo que no cubre."
  - title: "Saber, garantizar, alcanzar: extender el harness sin tocar su código"
    summary: "Skills, hooks y servidores MCP: tres formas de ampliar el harness, cada una con una capacidad distinta, dentro del mismo sandbox, y lo que cuestan en contexto."
  - title: "Delegar no es paralelizar: subagentes para proteger la ventana"
    summary: "Subagentes que leen en su propia ventana y devuelven solo un informe: tipos especializados, permisos que solo restringen y el modo plan, y lo que cuesta delegar, medido."
  - title: "Sesiones y evaluación"
    summary: "Transcripciones, retomar sesiones, replay, registro de lo que hace el agente y evals."
  - title: "Interfaz e integración"
    summary: "Una TUI con los comandos /compact y /context, y un modo sin interfaz para usar el harness desde scripts y CI."
