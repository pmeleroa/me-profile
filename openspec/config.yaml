# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  ## Reglas de redacción y estilo
  Idioma: Español (es-ES)
  Todos los artefactos deben escribirse en español.
  Mantén en inglés: encabezados estructurales de OpenSpec, keywords
  normativas (SHALL/MUST), IDs de change, rutas y ejemplos de código.
  Mantén en inglés términos técnicos: API, REST, endpoint, deployment.

  ## Contexto funcional del repositorio

  Sitio personal de Pablo Melero Alonso (pablomeleroalonso.me): Astro 7 + MDX,
  contenido en colecciones (src/content.config.ts) con Content Layer API
  (loader: glob) validadas con zod, npm, Node >=22.12.0 (CI en Node 24),
  sin backend ni CMS remoto.

  Posicionamiento: arquitectura y plataformas de ingeniería, con IA aplicada
  al desarrollo de software. Audiencia primaria: responsables de ingeniería
  y arquitectura; secundaria: arquitectos y líderes técnicos.

  No inventar logros, testimonios, cifras, empleo o premios no validados.
  Contenido pendiente se declara explícitamente como pendiente, nunca se
  sustituye con hechos inventados ni se marca como completado sin evidencia.

  ## Estrategia Git para SDD con OpenSpec

  ### Ramas y trazabilidad
  - Mantener main protegida, integrable y con código y specs alineados.
  - Usar una rama corta y una PR por cambio OpenSpec.
  - Nombrar ramas feat/<change-id>, fix/<change-id> o chore/<change-id>.
  - Usar el mismo change-id que en openspec/changes/<change-id>/.
  - Dividir cambios grandes en unidades independientes e integrables.
  - Para trabajo paralelo, usar un worktree y rama por cambio independiente.

  ### Convención de commits
  - Formato: <type>(<scope>): <description>.
  - Tipos: feat, fix, refactor, test, docs, chore y ci.
  - Scope funcional para código; openspec para artefactos del proceso.
  - Escribir mensajes descriptivos en inglés, evitando update, changes o WIP.
  - Añadir el trailer OpenSpec-Change: <change-id> a los commits del cambio.
  - Añadir Refs: <issue-id> cuando exista una incidencia asociada.
  - Indicar incompatibilidades mediante ! y el footer BREAKING CHANGE:.
  - Crear commits por unidad lógica revisable, no por archivo o checkbox.
  - Incluir código, pruebas y actualización de tasks.md en el mismo commit
    cuando correspondan a la misma tarea.

  ### Ciclo del cambio
  1. Crear la rama desde main actualizada.
  2. Versionar propuesta, delta specs, diseño y tareas según corresponda.
  3. Abrir una PR en borrador y revisar alcance y diseño antes de implementar.
  4. Implementar incrementalmente, manteniendo artefactos y código alineados.
  5. Si cambia el comportamiento acordado, actualizar specs y revisar el alcance.
  6. Ejecutar pruebas y openspec validate <change-id> --strict.
  7. Incorporar main y resolver conflictos, incluidos solapamientos semánticos
     entre especificaciones; repetir las verificaciones afectadas.
  8. Sincronizar los deltas y archivar el cambio en la misma rama antes del merge.
  9. Ejecutar openspec validate --all --strict tras el archivado.
  10. Integrar mediante squash merge con mensaje convencional y trailer OpenSpec.

  ### Pull requests y calidad
  - Incluir objetivo, change-id, artefactos, escenarios cubiertos, pruebas
    ejecutadas y consideraciones de compatibilidad, despliegue y reversión.
  - Exigir revisión y checks de CI antes del merge.
  - Validar formato OpenSpec, lint, pruebas y controles de seguridad aplicables.
  - Comprobar la correspondencia entre requisitos, escenarios y pruebas:
    la validación estructural de OpenSpec no demuestra cumplimiento funcional.
  - Fijar la versión de OpenSpec utilizada en local y CI.
  - Usar hooks locales como ayuda y CI como control obligatorio.
  - Validar también el mensaje final de squash para conservar la trazabilidad.

  ### Configuración del repositorio
  - Aplicar por repositorio mediante un script de preparación:
    - pull.ff=only
    - fetch.prune=true
    - push.default=simple
    - push.autoSetupRemote=true
    - rerere.enabled=true
    - rerere.autoupdate=false
    - merge.conflictStyle=zdiff3
  - Usar rebase en ramas personales y merge de main en ramas compartidas.
  - Definir en .gitattributes text=auto y finales LF para Markdown, YAML,
    JSON y scripts shell.
  - Versionar openspec/specs/, openspec/changes/ incluido archive/,
    openspec/config.yaml, esquemas propios e instrucciones compartidas.
  - Excluir secretos, credenciales, logs, cachés y configuración personal.
  - Bloquear pushes directos y force push a main.

  ### Agentes, releases y excepciones
  - Comprobar rama y estado de Git antes de modificar archivos.
  - Preparar únicamente archivos relacionados; preservar cambios ajenos.
  - Marcar tareas completadas solo con evidencia y registrar pruebas reales.
  - Realizar push y merge conforme a la autorización vigente del equipo.
  - Identificar releases mediante tags vMAJOR.MINOR.PATCH sobre main.
  - Archivar indica finalización para integración, no despliegue.
  - Mantener el mismo flujo para hotfixes, con documentación proporcional.
  - Revertir código y specs de forma coherente; documentar el motivo y
    contemplar acciones compensatorias para migraciones.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Toda propuesta que afecte a una colección de contenido de blog debe indicar si 
      cambia el contrato de publicación (status/approvedBy/approvedAt) y, si lo hace, por qué.

  design:
    - "Toda imagen nueva referenciada en contenido público (posts del blog,
      og:image, o cualquier asset servido a los visitantes) debe entregarse
      ya optimizada: formato comprimido moderno (WebP o AVIF, no PNG/JPEG
      sin procesar) y dimensiones acordes al mayor contexto de uso real en
      el sitio, no el tamaño original de la fuente. Si el asset se sirve
      desde public/ sin pasar por la pipeline de imágenes de Astro
      (astro:assets), design.md debe justificar esa elección o indicar la
      conversión a realizar antes de commitear el archivo. Ligado a Q05
      (rendimiento) de operations.apply.guidance."
    - Justificar cualquier dependencia nueva frente a usar el stack
      existente (Astro, colecciones de contenido, gtag vía Partytown); no
      añadir backend, CMS o tracker adicional por conveniencia.
    - "Todo contenido técnico publicado para el lector (comandos, pasos de
      instalación, scripts y ejemplos de terminal en posts y guías) debe
      diseñarse para una terminal Linux. macOS se considera cubierto cuando
      el comando es idéntico; Windows se cubre solo con una referencia a
      WSL2 (guía oficial de Microsoft), sin variantes de PowerShell ni pasos
      de configuración de WSL2. design.md debe justificar cualquier excepción
      (p. ej. un paso que difiere en macOS). La verificación puede hacerse en
      la máquina del autor cuando el comando es idéntico en Linux y macOS; si
      no lo es, design.md debe indicar cómo se verifica la variante Linux."
    - "Trabajo futuro pendiente (blog): hacer `image` obligatorio en el
      schema de la colección `blog` (src/content.config.ts), en vez de
      opcional con placeholder de marca en BlogCard (ver
      openspec/changes/archive/redesign-blog-card o specs/blog/spec.md
      tras archivar). Cualquier propuesta que aborde esto debe incluir:
      (1) un plan de migración explícito para los posts existentes que
      hoy no definen `image` (añadirles una imagen real antes de, o como
      parte de, hacer el campo obligatorio — nunca fijar el campo como
      requerido dejando posts sin imagen y sin backfill); (2) el checklist
      de publicación de imagen ya acordado (formato optimizado, tamaño
      recomendado ~1200x630 por ser también el og:image en Layout.astro,
      archivo en public/images/blog/<nombre>.<ext>, referenciado como ruta
      raíz-relativa en el frontmatter); (3) si se sustituye por completo el
      placeholder de marca, justificar frente a mantenerlo como fallback
      para fuentes de datos ajenas a la colección `blog` (p.ej. datos de
      ejemplo) que sigan sin imagen."
    - "Trabajo futuro pendiente (blog): visualizar las series de posts en el
      blog, en un change propio (`add-blog-series`), no dentro de un change de
      contenido, porque toca el schema de src/content.config.ts,
      src/pages/blog/[slug].astro y specs/blog/spec.md. Plantearlo cuando se
      prepare la segunda parte de una serie, no antes. Punto de partida
      debatido, sin decidir: (A1) etiqueta 'Serie: X · Parte N' en la cabecera
      del artículo; (A2) bloque de navegación de la serie (índice de partes y
      anterior/siguiente) antes de autor y relacionados, visible solo con 2 o
      más partes publicadas, para no listar partes que aún no existen. Badge
      en tarjetas, página /blog/series/<id> y filtro en el listado, para más
      adelante. La propuesta debe decidir: (1) campo en el frontmatter frente a
      colección de series; (2) cómo evitar que 'Artículos relacionados' (por
      tags) duplique las partes que ya muestra A2."
    - "Trabajo futuro pendiente (blog): continuar la serie de guías sobre un
      asistente de código local con Ollama, cuyo post 1 es
      ollama-primeros-pasos-asistente-de-codigo-local.mdx. Su lista final 'Lo
      que le falta a este harness' es la hoja de ruta pública de la serie.
      Orden recomendado: ventana de contexto y hardware (por defecto 4k tokens
      con menos de 24 GiB de VRAM; las herramientas de código necesitan al
      menos 64k) -> historial y contexto propio -> salida estructurada y
      herramientas (decidir pronto si se usa MCP, porque cambia la
      arquitectura) -> bucle agéntico -> seguridad -> integración. Solo entran
      temas relacionados con el harness local. 'Varios modelos', 'elección de
      modelo' y 'cuándo local no basta' quedan fuera de la serie; los dos
      últimos tienen su propia entrada de trabajo futuro. Cada post de la serie debe: no justificar por qué ejecutar en
      local; no usar el ángulo corporativo ni de aprobación de la empresa; no
      nombrar productos comerciales como referencia del asistente; escribir
      el contenido técnico para una terminal Linux (ver la regla de Linux); y
      usar listas de una línea por punto, sin sublistas."
    - "Trabajo futuro pendiente (blog): post independiente, fuera de la serie
      de guías sobre el asistente de código local, sobre cómo elegir un modelo
      para un asistente de código local. Categoría propuesta: Análisis, porque
      compara y mide. El autor lo considera un
      tema que da para mucho debate. En la serie, qwen2.5-coder se usa solo
      para arrancar, y el post 1
      (ollama-primeros-pasos-asistente-de-codigo-local.mdx) dice que elegir
      modelo 'da para mucho debate y queda fuera de esta guía'. Posibles ejes,
      sin decidir: tamaño frente a RAM/VRAM, soporte de tools, ventana de
      contexto y cómo medirlo con tareas propias (evaluación y tokens por
      segundo). No se hacen afirmaciones de rendimiento sin medición propia o
      una fuente citada. Cuando exista, valorar enlazarlo desde el post 1.
      Distinto del post sobre cuándo local no basta, que da por hecho usar
      local."
    - "Trabajo futuro pendiente (blog): post independiente, fuera de la serie
      de guías sobre el asistente de código local, sobre cuándo un modelo
      local no basta y sí compensa la nube. Categoría propuesta: Opinión,
      porque es una tesis que defender. Es la otra cara de la tesis del post 1
      ('no todos los casos de uso de IA necesitan consumir un LLM en la
      nube'). No va en la serie porque cuestiona si usar local, y la serie
      tiene la regla de no justificar la ejecución en local. Enlace natural
      con ai-routing-y-soberania-tecnologica.mdx. No se hacen afirmaciones de
      rendimiento o calidad sin medición propia o una fuente citada. Distinto
      del post de elección de modelo, que da por hecho usar local."

  tasks:
    - Cada tarea de implementación de un requisito de contenido público debe
      incluir su verificación (comando ejecutado + resultado observado), no
      solo el checkbox marcado.
    - Registrar el mecanismo de rollback (git checkout/clean o revert)
      cuando la tarea toca código ya en producción.
    - "Toda tarea que fije draft: false en un post de src/content/blog/ debe verificar explícitamente si existe confirmación del owner para publicar ese post concreto (pregunta y respuesta literales registradas en la tarea); si no la hay, la tarea debe dejar o fijar draft: true y registrar que no hubo confirmación — nunca fijar draft: false por defecto."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Requisitos transversales de calidad a verificar por cambio de contenido/UI público: Q01 contenido esencial sin JS, Q02 uso adaptable (360/390/768/1440px sin scroll horizontal), Q03 accesibilidad WCAG 2.2 AA, Q04 prefers-reduced-motion respetado, Q05 rendimiento (Lighthouse móvil >=90, sin regresión >5 puntos), Q06 integridad de publicación (draft/review nunca en salida pública), Q07 integridad de navegación (enlaces/rutas válidos), Q08 seguridad de contenido (sin HTML/JS arbitrario desde datos no confiables, sin secretos ni PII en eventos), Q09 confirmación de publicación (draft:false en un post solo tras confirmación explícita del owner registrada en la tarea correspondiente de tasks.md; sin confirmación, el post permanece en draft:true)."
      - Usar npm run build + inspección de dist/ como verificación real;
        preferir fixtures temporales no versionados sobre contenido de
        prueba permanente en el repositorio.
      - No publicar la web ni marcar contenido como aprobado por el mero
        hecho de completar una especificación; distinguir implementación
        terminada de contenido aprobado y de publicación realizada.
  archive:
    guidance:
      - Al archivar, confirmar que ningún requisito describe contenido
        real no aprobado (nombres de cliente, cifras, logros) como si ya
        estuviera publicado.
      - Al archivar, si el design.md (o la propuesta) del change cambia el
        stack técnico (versión de framework, runtime, forma de definir
        datos/colecciones, herramientas de build), verificar que la sección
        "Contexto funcional del repositorio" de context en openspec/config.yaml
        lo refleja, y actualizarla en la misma rama antes de archivar.
